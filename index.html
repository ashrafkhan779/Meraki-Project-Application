<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobOps — Job &amp; Operations System</title>
<meta name="description" content="Job management, costing, roster planning and reporting — local prototype">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&family=Roboto+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F5FD;--surface:#FFFFFF;--raised:#E8EEFC;--text:#162541;--muted:#4F607E;--faint:#7A8AA5;
  --accent:#244DC7;--accent-2:#4A76E6;--on-accent:#fff;--border:#D5DCE3;--rule:#E4E9F0;--control:#8494AD;
  --success:#166B42;--success-bg:#E5F4EC;--warning:#805000;--warning-bg:#FDF1DC;--danger:#A32341;--danger-bg:#FBE8EC;
  --info:#245B97;--info-bg:#E4EEF9;--purple:#5B3B9A;--purple-bg:#EFE9FA;--neutral-bg:#EEF1F5;
  --c1:#244DC7;--c2:#7FA0F0;--c3:#15746A;--c4:#A94072;--c5:#9C5A0B;--c6:#7144AC;
  --r:10px;--r-sm:6px;--shadow:0 1px 2px rgba(22,37,65,.06),0 4px 16px rgba(22,37,65,.05);
  --f-head:"Plus Jakarta Sans",system-ui,sans-serif;--f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Roboto Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  --side:236px;--t:.16s;
}
@media (prefers-reduced-motion:reduce){:root{--t:0s}*{animation:none!important;transition:none!important}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;letter-spacing:-.01em}
h1{font-size:22px;font-weight:700}h2{font-size:16px;font-weight:700}h3{font-size:14px;font-weight:700}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12px}.nowrap{white-space:nowrap}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:18px;height:18px;flex:none;stroke-width:1.8;stroke-linecap:square;stroke-linejoin:miter;vertical-align:middle}
.ico.sm{width:15px;height:15px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;border-bottom:1px solid var(--rule)}
.brand .logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;font:700 13px var(--f-head)}
.brand b{display:block;font:700 14px var(--f-head);line-height:1.15}
.brand span{font-size:11.5px;color:var(--muted)}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:12px 10px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;text-decoration:none;color:var(--muted);font-weight:500;position:relative;transition:background var(--t),color var(--t)}
.nav a:hover{background:var(--raised);color:var(--text)}
.nav a[aria-current=page]{background:var(--raised);color:var(--accent);font-weight:600}
.nav a[aria-current=page]::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav a .cnt{margin-left:auto;font:500 11px var(--f-num);color:var(--faint)}
.side-foot{padding:12px 14px;border-top:1px solid var(--rule);font-size:12px;color:var(--muted)}
.side-foot label{display:block;font-weight:600;margin-bottom:4px;color:var(--text)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(241,245,253,.92);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:12px;padding:10px 28px;min-height:56px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-width:0;flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{color:var(--accent);text-decoration:underline}
.crumbs b{color:var(--text);font-weight:600}
.top .spacer{flex:1}
.icon-btn.menu-btn{display:none}
.page{padding:22px 28px 60px;max-width:1560px;width:100%}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.page-head .t{flex:1;min-width:240px}
.page-head p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- controls ---------- */
.btn{text-decoration:none;color:var(--text);display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;transition:background var(--t),border-color var(--t),color var(--t)}
.btn:hover{border-color:var(--control);background:#FAFBFE}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:#1D40AA}
.btn.danger{color:var(--danger);border-color:#E3B5C0}.btn.danger:hover{background:var(--danger-bg)}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--raised)}
.btn.sm{height:28px;padding:0 9px;font-size:12px}
.btn[disabled],.btn[aria-disabled=true]{opacity:.5;cursor:not-allowed;transform:none}
.icon-btn{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:6px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--raised);color:var(--text)}
.icon-btn.danger:hover{color:var(--danger);background:var(--danger-bg)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=search],input[type=password],select,textarea{width:100%;height:34px;border:1px solid var(--border);border-radius:var(--r-sm);background:#fff;padding:0 10px;font-size:13px;transition:border-color var(--t),box-shadow var(--t)}
textarea{height:auto;min-height:72px;padding:8px 10px;resize:vertical}
input:hover,select:hover,textarea:hover{border-color:var(--control)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,77,199,.15)}
input[readonly],input:disabled,select:disabled,textarea:disabled,textarea[readonly]{background:var(--neutral-bg);color:var(--muted);cursor:not-allowed}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--muted)}
.field>span em{color:var(--danger);font-style:normal}
.field .hint{font-size:11.5px;color:var(--faint)}
.field .err{font-size:12px;color:var(--danger);font-weight:500}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger)}
.form-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px 14px}
.form-grid .s3{grid-column:span 3}.form-grid .s4{grid-column:span 4}.form-grid .s6{grid-column:span 6}.form-grid .s8{grid-column:span 8}.form-grid .s12{grid-column:span 12}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.search{position:relative;min-width:220px;flex:1;max-width:360px}
.search .ico{position:absolute;left:9px;top:8px;color:var(--faint)}
.search input{padding-left:32px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px}
.filters select,.filters input[type=date]{width:auto;min-width:130px}
.filters .lbl{font-size:12px;color:var(--muted);font-weight:600}
.seg{display:inline-flex;max-width:100%;overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);padding:2px;gap:2px}
.seg button{white-space:nowrap;flex:none;border:0;background:transparent;height:28px;padding:0 11px;border-radius:4px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;scrollbar-width:thin}
.tabs a,.tabs button{position:relative;display:inline-flex;align-items:center;gap:7px;padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;font-size:13px;border:0;background:none;cursor:pointer;white-space:nowrap}
.tabs a:hover,.tabs button:hover{color:var(--text)}
.tabs [aria-selected=true]{color:var(--accent)}
.tabs [aria-selected=true]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px 2px 0 0}
.tabs .cnt{font:500 11px var(--f-num);background:var(--raised);color:var(--muted);padding:1px 6px;border-radius:10px}

/* ---------- cards / kpis ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.card-h h2,.card-h h3{flex:1}
.card-h .sub{font-size:12px;color:var(--muted);font-weight:500;font-family:var(--f-body)}
.card-b{padding:14px 16px 16px}
.grid{display:grid;gap:14px}
.g12{grid-template-columns:repeat(12,minmax(0,1fr))}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.kpi-groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kgroup{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px 6px;box-shadow:var(--shadow)}
.kgroup>h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin-bottom:4px;font-family:var(--f-body);display:flex;align-items:center;gap:6px}
.kpi{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--rule);text-decoration:none;color:inherit;border-radius:4px}
.kgroup>h3+.kpi{border-top:0}
a.kpi:hover .kl{color:var(--accent);text-decoration:underline}
.kpi .kl{font-size:12.5px;color:var(--muted)}
.kpi .kv{font:600 14px var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi.lead .kv{font-size:20px;font-weight:700;color:var(--text)}
.kpi .ks{display:block;font-size:11px;color:var(--faint);font-family:var(--f-body);font-weight:500}
.insight{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:0;border-radius:var(--r);overflow:hidden;background:linear-gradient(135deg,#1A3A9E,#244DC7 55%,#3E68DA);color:#fff;margin-bottom:14px;box-shadow:var(--shadow)}
.insight>div{padding:16px 18px;border-left:1px solid rgba(255,255,255,.14)}
.insight>div:first-child{border-left:0}
.insight .il{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.78;font-weight:600}
.insight .iv{font:700 26px var(--f-num);letter-spacing:-.03em;margin-top:4px;white-space:nowrap}
.insight .is{font-size:12.5px;opacity:.86;margin-top:2px}
.insight a{color:#fff}
.insight .msg{font:600 15px/1.35 var(--f-head)}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:5px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--neutral-bg);color:var(--muted)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.badge.nodot::before{display:none}
.b-open{background:var(--info-bg);color:var(--info)}
.b-planned{background:var(--purple-bg);color:var(--purple)}
.b-progress{background:var(--raised);color:var(--accent)}
.b-hold{background:var(--warning-bg);color:var(--warning)}
.b-hold::before{border-radius:1px}
.b-completed{background:var(--success-bg);color:var(--success)}
.b-closed{background:#E3E7EE;color:#2B3A55}
.b-closed::before{border-radius:1px;transform:rotate(45deg)}
.b-cancelled{background:var(--danger-bg);color:var(--danger)}
.b-cancelled::before{width:8px;height:2px;border-radius:0}
.b-ok{background:var(--success-bg);color:var(--success)}
.b-warn{background:var(--warning-bg);color:var(--warning)}
.b-bad{background:var(--danger-bg);color:var(--danger)}
.b-info{background:var(--info-bg);color:var(--info)}
.lock{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:#2B3A55}
.var-fav{color:var(--success)}.var-unf{color:var(--danger)}
.var-fav::before{content:"▼ ";font-size:9px}.var-unf::before{content:"▲ ";font-size:9px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 10px;border-radius:13px;background:var(--raised);color:var(--accent);font-size:12px;font-weight:600}
.chip button{border:0;background:none;cursor:pointer;color:inherit;width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.chip button:hover{background:rgba(36,77,199,.15)}
.demo-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;background:var(--warning-bg);color:var(--warning);font-size:12px;font-weight:700}
.store-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:600}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto;border-top:1px solid var(--rule);max-width:100%}
.card>.tbl-wrap:first-child{border-top:0}
table.dt{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.dt caption{text-align:left;padding:0 0 8px;font-weight:600}
.dt th{position:sticky;top:0;z-index:1;background:#F7F9FD;text-align:left;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.dt th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.dt th button:focus-visible{outline:2px solid var(--accent)}
.dt th[aria-sort] button{color:var(--accent)}
.dt td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
.dt tbody tr:hover td{background:#FAFBFF}
.dt tbody tr.click{cursor:pointer}
.dt .r{text-align:right}.dt .c{text-align:center}
.dt td.r{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.dt tfoot td{font-weight:700;background:#F7F9FD;border-top:1px solid var(--border);border-bottom:0}
.dt .jobno{font:600 12.5px var(--f-num);color:var(--accent);text-decoration:none;white-space:nowrap}
.dt .jobno:hover{text-decoration:underline}
.dt .desc{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt .row-actions{white-space:nowrap;text-align:right}
.pager{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.pager .spacer{flex:1}
.pager select{width:auto;height:28px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .ico{width:34px;height:34px;color:var(--faint);margin-bottom:8px}
.empty b{display:block;color:var(--text);font-size:14px;margin-bottom:4px}

/* ---------- job detail ---------- */
.job-head{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.job-head .row1{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.job-head .jn{font:700 20px var(--f-num);letter-spacing:-.03em}
.job-head .meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.job-head .meta b{color:var(--text);font-weight:600}
.fin-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--rule);margin-top:14px;padding-top:12px;gap:8px}
.fin-strip .fl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600}
.fin-strip .fv{font:700 16px var(--f-num);letter-spacing:-.02em;margin-top:2px}
.fin-strip .fs{font-size:11.5px;color:var(--muted)}
.lockbar{display:flex;gap:10px;align-items:center;background:#EEF1F6;border:1px solid #CBD3DF;color:#2B3A55;padding:10px 14px;border-radius:var(--r-sm);margin-bottom:14px;font-size:13px}
.lockbar.warn{background:var(--warning-bg);border-color:#EBCF9E;color:var(--warning)}
details.sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;box-shadow:var(--shadow)}
details.sec>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:10px;font:700 14px var(--f-head)}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .ico{transition:transform var(--t);color:var(--faint)}
details.sec[open]>summary .ico.chev{transform:rotate(90deg)}
details.sec>summary .sum-r{margin-left:auto;font:500 12px var(--f-body);color:var(--muted)}
details.sec>.sec-b{padding:4px 16px 16px;border-top:1px solid var(--rule);padding-top:14px}
.cost-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);margin-bottom:14px;box-shadow:var(--shadow)}
.cost-sum>div{padding:12px 16px;border-left:1px solid var(--rule)}
.cost-sum>div:first-child{border-left:0}
.cost-sum .fl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600}
.cost-sum .fv{font:700 18px var(--f-num);margin-top:3px;letter-spacing:-.02em}
.cost-sum .fs{font-size:12px;color:var(--muted)}
.pva{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;font-size:12.5px;padding:6px 0}
.pva .bars{display:flex;flex-direction:column;gap:3px}
.pva .bar{height:9px;border-radius:2px;background:var(--c2);min-width:1px}
.pva .bar.a{background:var(--c1)}
.pva .bar.a.over{background:var(--danger)}
.timeline-list{list-style:none;margin:0;padding:0}
.timeline-list li{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:13px}
.timeline-list li .when{color:var(--muted);font-size:12px}
.diff{font:12px var(--f-num);color:var(--muted);margin-top:4px;word-break:break-word}
.diff del{color:var(--danger);text-decoration:line-through}.diff ins{color:var(--success);text-decoration:none}

/* ---------- roster ---------- */
.roster{overflow:auto;max-height:calc(100vh - 290px);border-top:1px solid var(--rule)}
.rgrid{border-collapse:separate;border-spacing:0;font-size:12px}
.rgrid th,.rgrid td{border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);padding:0;height:34px}
.rgrid thead th{position:sticky;top:0;background:#F7F9FD;z-index:2;font-weight:600;color:var(--muted);font-size:11px;text-align:center;padding:4px 2px;min-width:30px}
.rgrid thead th.we{color:var(--faint);background:#EFF2F7}
.rgrid thead th.today{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.rgrid .emp{position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;padding:4px 10px;min-width:210px;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rgrid thead .emp{z-index:3}
.rgrid .emp button{all:unset;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--text)}
.rgrid .emp button:hover,.rgrid .emp button:focus-visible{color:var(--accent);text-decoration:underline}
.rgrid .emp .et{display:block;font-size:11px;color:var(--faint)}
.rgrid tr.sel .emp{box-shadow:inset 3px 0 0 var(--accent);background:var(--raised)}
.rc{min-width:30px;text-align:center;font:600 10.5px var(--f-num);color:#fff;cursor:default}
.rc.we{background:repeating-linear-gradient(135deg,#F3F5F9 0 4px,#EBEEF4 4px 8px)}
.rc.a0{background:#fff}
.rc.a1{background:#BFD0F6;color:#132C78}
.rc.a2{background:#7FA0F0;color:#0D1F57}
.rc.a3{background:#244DC7}
.rc.over{background:var(--danger)}
.rc.leave{background:repeating-linear-gradient(135deg,#F8E3B9 0 4px,#F2D597 4px 8px);color:var(--warning)}
.rc.done{background:#C9DCCF;color:#123E27}
.rc.pend{background:#E2D8F5;color:var(--purple)}
.rgrid.wide .rc{min-width:110px;text-align:left;padding:3px 6px;font:500 11px var(--f-body);line-height:1.25}
.rgrid.wide thead th{min-width:110px}
.rgrid.tight .rc,.rgrid.tight thead th{min-width:12px;font-size:0}
.rgrid.tight thead th.mstart{font-size:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:10px 16px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px;border:1px solid rgba(0,0,0,.06)}
.emp-list{max-height:430px;overflow:auto}
.emp-row{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--rule);font-size:13px}
.emp-row:hover{background:#FAFBFF}
.emp-row .nm{flex:1;min-width:0}
.emp-row .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emp-row .nm span{font-size:11.5px;color:var(--faint)}

/* ---------- charts ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:11px var(--f-body);fill:var(--muted)}
.chart .axis line,.chart .grid line{stroke:var(--rule)}
.chart .zero{stroke:var(--control)}
.chart .lbl{font:600 11px var(--f-num);fill:var(--text)}
.chart [data-drill]{cursor:pointer}
.chart [data-drill]:hover{opacity:.85}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.chart-legend i.line{height:3px;border-radius:0;vertical-align:3px}
.chart-legend i.dash{height:0;border-top:2px dashed;background:none!important;vertical-align:3px}
.tip{position:fixed;z-index:200;pointer-events:none;background:#162541;color:#fff;font-size:12px;padding:7px 9px;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:260px;opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
.tip b{font-family:var(--f-num)}

/* ---------- modal / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(14,24,46,.42);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;z-index:100;overflow:auto;animation:fade .18s ease}
.modal{background:var(--surface);border-radius:12px;width:min(760px,100%);box-shadow:0 20px 60px rgba(14,24,46,.3);animation:pop .2s ease}
.modal.wide{width:min(1000px,100%)}.modal.narrow{width:min(480px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--rule)}
.modal-h h2{flex:1}
.modal-b{padding:18px 20px;max-height:68vh;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--rule);background:#FAFBFE;border-radius:0 0 12px 12px;flex-wrap:wrap}
.modal-f .left{margin-right:auto;font-size:12px;color:var(--muted);align-self:center}
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:var(--r-sm);font-size:13px;margin-bottom:12px;align-items:flex-start}
.alert.err{background:var(--danger-bg);color:var(--danger)}
.alert.warn{background:var(--warning-bg);color:var(--warning)}
.alert.info{background:var(--info-bg);color:var(--info)}
.alert.ok{background:var(--success-bg);color:var(--success)}
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:300}
.toast{background:#162541;color:#fff;padding:11px 14px;border-radius:8px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;gap:9px;align-items:center;max-width:380px;animation:pop .2s ease}
.toast.err{background:var(--danger)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.985)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.enter{animation:rise .32s ease both}

/* ---------- settings / perms ---------- */
.set-grid{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
.set-nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:72px}
.set-nav a{padding:8px 12px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500;font-size:13px}
.set-nav a:hover{background:var(--surface);color:var(--text)}
.set-nav a[aria-current=page]{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.perm-table th.rot{writing-mode:vertical-rl;transform:rotate(180deg);height:150px;text-align:left;padding:8px 4px;text-transform:none;letter-spacing:0;font-size:11.5px}
.perm-table td.c{padding:6px 4px}
.list-editor{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.test-row{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13px}
.test-row .d{font-size:12px;color:var(--muted);margin-top:2px}
.boot{display:grid;place-items:center;min-height:100vh;padding:20px}
.boot .card{max-width:620px;padding:28px}
.boot code{background:var(--raised);padding:2px 6px;border-radius:4px;font-family:var(--f-num);font-size:12.5px}
.drop{border:2px dashed var(--border);border-radius:var(--r);padding:16px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- responsive ---------- */
@media (max-width:1280px){.kpi-groups{grid-template-columns:repeat(3,minmax(0,1fr))}.insight{grid-template-columns:1fr 1fr}.insight>div:nth-child(3){border-left:0}.insight>div:nth-child(n+3){border-top:1px solid rgba(255,255,255,.14)}}
@media (max-width:1100px){.c4,.c5,.c6,.c7,.c8{grid-column:span 12}.fin-strip{grid-template-columns:repeat(3,minmax(0,1fr))}.set-grid{grid-template-columns:1fr}.set-nav{position:static;flex-direction:row;flex-wrap:wrap}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:min(280px,85vw);transform:translateX(-102%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .icon-btn.menu-btn{display:inline-grid}
  .top{padding:8px 16px}.page{padding:16px 16px 60px}
  .kpi-groups{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form-grid .s3,.form-grid .s4{grid-column:span 6}.form-grid .s6,.form-grid .s8{grid-column:span 12}
  .cost-sum{grid-template-columns:1fr 1fr}.cost-sum>div:nth-child(3){border-left:0}.cost-sum>div:nth-child(n+3){border-top:1px solid var(--rule)}
  .top .hide-m{display:none}
  .pva{grid-template-columns:110px 1fr 90px}
}
@media (max-width:560px){
  .kpi-groups{grid-template-columns:1fr}.insight{grid-template-columns:1fr}.insight>div{border-left:0!important;border-top:1px solid rgba(255,255,255,.14)}.insight>div:first-child{border-top:0}
  .form-grid .s3,.form-grid .s4{grid-column:span 12}
  .fin-strip{grid-template-columns:1fr 1fr}
  .search{max-width:none;min-width:100%}
  .timeline-list li{grid-template-columns:1fr}
  h1{font-size:19px}
}
@media print{
  .side,.top,.filters,.actions,.pager,.no-print,.tabs{display:none!important}
  .shell{display:block}.page{padding:0}.card{box-shadow:none;border:0}
  body{background:#fff}.dt th{position:static}.tbl-wrap,.roster{overflow:visible;max-height:none}
}

@media (max-width:560px){.filters>*{max-width:100%}.filters select,.filters input[type=date]{flex:1 1 130px;min-width:0}}

.with-add{display:flex;gap:6px;min-width:0}.with-add select{flex:1;min-width:0}.with-add .btn{height:34px;flex:none}

@media (min-width:1800px){.kpi-groups{grid-template-columns:repeat(6,minmax(0,1fr))}}

/* KPI rail: six groups in one row — label above value, compact figures */
.kpi-groups{grid-template-columns:repeat(6,minmax(0,1fr))!important;gap:10px}
.kgroup{padding:11px 12px 6px}
.kgroup>h3{font-size:10.5px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:1px;padding:6px 0}
.kpi .kl{font-size:12px;line-height:1.3}
.kpi .kv{font-size:14.5px;line-height:1.25}
.kpi.lead .kv{font-size:19px}
.kpi .ks{display:block;font-size:10.5px;color:var(--faint);line-height:1.3}
@media (max-width:1100px){.kpi-groups{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
@media (max-width:640px){.kpi-groups{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media (max-width:380px){.kpi-groups{grid-template-columns:1fr!important}}

<script>
/* =====================================================================
   JobOps core — utilities, store, permissions, calculation engine, API
   In the Supabase phase, everything in API.* moves server-side
   (Postgres functions + RLS). The browser here only emulates that layer.
   ===================================================================== */
'use strict';
const STORE_KEY = 'jobops.db.v1', USER_KEY = 'jobops.user';
const JOB_TYPES = ['Service', 'Supply', 'Supply/Services'];
const TYPE_SLUG = { 'Service': 'service', 'Supply': 'supply', 'Supply/Services': 'supply-services' };
const SLUG_TYPE = { service: 'Service', supply: 'Supply', 'supply-services': 'Supply/Services', all: null };
const INVOICE_STATUSES = ['Uninvoiced', 'Unpaid', 'Partially Paid', 'Paid'];
const PERMS = [
  ['viewOverview', 'View Overview tab', 'Tabs'], ['viewJobs', 'View Jobs tab', 'Tabs'], ['viewRoster', 'View Roster tab', 'Tabs'],
  ['viewMaster', 'View Master Data tab', 'Tabs'], ['viewReports', 'View Reports tab', 'Tabs'], ['viewSettings', 'View Settings tab', 'Tabs'],
  ['jobCreate', 'Create jobs', 'Jobs'], ['quickAddMaster', 'Quick-add companies, end-clients & engineers from the job form', 'Jobs'], ['jobEdit', 'Edit jobs', 'Jobs'], ['jobDelete', 'Archive (delete) jobs', 'Jobs'],
  ['viewFinancials', 'View financial data', 'Finance'], ['editFinancials', 'Edit financial data (PO values)', 'Finance'],
  ['viewCostRates', 'View employee cost rates', 'Finance'],
  ['manageManpower', 'Manage manpower costs', 'Costing'], ['manageMaterials', 'Manage materials & transfers', 'Costing'],
  ['manageMisc', 'Manage miscellaneous expenses', 'Costing'],
  ['changeInvoiceStatus', 'Manage invoices / change invoice status', 'Invoicing'], ['recordPayments', 'Record payments', 'Invoicing'],
  ['closeJobs', 'Close jobs', 'Closure'], ['reopenJobs', 'Reopen jobs', 'Closure'], ['editClosedJobs', 'Edit closed (locked) jobs', 'Closure'],
  ['exportReports', 'Export data & reports', 'Data'], ['manageMaster', 'Manage master data', 'Data'],
  ['rosterAssign', 'Assign employees (roster)', 'Roster'], ['overrideConflicts', 'Override roster conflicts', 'Roster'],
  ['manageUsers', 'Manage users & roles', 'Admin'], ['manageSettings', 'Change application settings', 'Admin'],
];
const COST_PERM = {
  plannedManpower: 'manageManpower', actualManpower: 'manageManpower', plannedMaterials: 'manageMaterials',
  actualMaterials: 'manageMaterials', inventoryTransfers: 'manageMaterials', plannedMisc: 'manageMisc', actualMisc: 'manageMisc',
  jobAttachments: 'jobEdit',
};
const TABLE_LABEL = {
  jobs: 'Job', plannedManpower: 'Planned manpower', actualManpower: 'Actual manpower', plannedMaterials: 'Planned material',
  actualMaterials: 'Actual material', inventoryTransfers: 'Store transfer', plannedMisc: 'Planned misc. cost',
  actualMisc: 'Actual misc. cost', miscPayments: 'Misc. payment', invoices: 'Invoice', invoicePayments: 'Invoice payment',
  customers: 'Customer', endClients: 'End-client', suppliers: 'Supplier', employees: 'Employee', leaves: 'Leave',
  inventoryItems: 'Store item', stockReceipts: 'Stock receipt', assignments: 'Assignment', users: 'User', roles: 'Role',
  settings: 'Settings', jobComments: 'Comment', jobAttachments: 'Attachment', closures: 'Closure',
};
const ALL_TABLES = ['customers', 'endClients', 'suppliers', 'employees', 'leaves', 'inventoryItems', 'stockReceipts', 'jobs',
  'plannedManpower', 'actualManpower', 'assignments', 'plannedMaterials', 'actualMaterials', 'inventoryTransfers', 'plannedMisc',
  'actualMisc', 'miscPayments', 'invoices', 'invoicePayments', 'jobStatusHistory', 'poRevisions', 'jobComments', 'jobAttachments',
  'closures', 'roles', 'users', 'auditLog'];

/* ---------------- utilities ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => s == null ? '' : String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => `${p}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
const num = v => (v === '' || v == null || isNaN(+v)) ? 0 : +v;
const isNum = v => v !== '' && v != null && !isNaN(+v);
const r2 = x => { x = num(x); const s = x < 0 ? -1 : 1; return s * Math.round(Math.abs(x) * 100 + 1e-7) / 100; };
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
const clone = o => JSON.parse(JSON.stringify(o));
const nowISO = () => new Date().toISOString();
const by = (k, dir = 1) => (a, b) => { const x = a[k], y = b[k]; return (x == null ? -Infinity : x) > (y == null ? -Infinity : y) ? dir : (x == null ? -Infinity : x) < (y == null ? -Infinity : y) ? -dir : 0; };
function todayISO() {
  try { return new Intl.DateTimeFormat('en-CA', { timeZone: (APP.db && APP.db.settings.timezone) || 'Asia/Dubai', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
  catch (e) { return new Date().toISOString().slice(0, 10); }
}
const validDate = s => !s || (/^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s + 'T00:00:00Z')));
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dayDiff = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 864e5);
const dow = iso => new Date(iso + 'T00:00:00Z').getUTCDay();
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtDate = s => { if (!s) return '—'; const d = String(s).slice(0, 10).split('-'); return `${+d[2]} ${MON[+d[1] - 1]} ${d[0]}`; };
const fmtDT = s => { if (!s) return '—'; const d = new Date(s); return isNaN(d) ? s : d.toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: APP.db?.settings.timezone || 'Asia/Dubai' }); };
const monthKey = s => s ? String(s).slice(0, 7) : null;
const monthLabel = k => { const [y, m] = k.split('-'); return `${MON[+m - 1]} ${y.slice(2)}`; };
function fmtN(v, dp) { if (v == null || v === '' || isNaN(v)) return '—'; dp = dp ?? (APP.db?.settings.precision ?? 2); return (+v).toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp }); }
function money(v, o = {}) {
  if (o.mask !== false && !can('viewFinancials')) return '<span class="faint" title="Hidden — requires “View financial data” permission">•••••</span>';
  if (v == null || v === '' || isNaN(v)) return '—';
  const cur = o.cur === false ? '' : (APP.db.settings.currency + ' ');
  return cur + fmtN(v, o.dp);
}
const moneyTxt = (v, dp) => v == null || isNaN(v) ? '' : `${APP.db.settings.currency} ${fmtN(v, dp)}`;
function compact(v) {
  if (v == null || isNaN(v)) return '—'; const a = Math.abs(v), s = v < 0 ? '−' : '';
  if (a >= 1e6) return s + (a / 1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M';
  if (a >= 1e3) return s + (a / 1e3).toFixed(a >= 1e5 ? 0 : 1) + 'K';
  return s + a.toFixed(0);
}
const pct = (v, dp = 1) => v == null || isNaN(v) ? 'N/A' : `${(+v).toFixed(dp)}%`;
const debounce = (fn, ms = 200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* ---------------- errors ---------------- */
class AppError extends Error { constructor(msg, kind = 'error', extra = {}) { super(msg); this.kind = kind; Object.assign(this, extra); } }
const deny = msg => { throw new AppError(msg || 'You do not have permission for this action.', 'forbidden'); };
const invalid = (msg, fields) => { throw new AppError(msg, 'validation', { fields }); };

/* ---------------- state ---------------- */
const APP = { db: null, user: null, rev: 0, cache: {}, tokens: new Set(), source: '' };

const Store = {
  async boot() {
    let raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) { }
    if (raw) { try { APP.db = JSON.parse(raw); APP.source = 'browser'; } catch (e) { APP.db = null; } }
    if (!APP.db) {
      const r = await fetch('data.json', { cache: 'no-store' });
      if (!r.ok) throw new Error('data.json not found (' + r.status + ')');
      APP.db = await r.json(); APP.source = 'data.json';
      Store.normalize(); Store.persist();
    }
    if (Store.normalize()) Store.persist();
    let uidSaved = null; try { uidSaved = localStorage.getItem(USER_KEY); } catch (e) { }
    APP.user = APP.db.users.find(u => u.id === uidSaved && u.active) || APP.db.users.find(u => u.active && roleOf(u)?.permissions.manageUsers) || APP.db.users.find(u => u.active);
  },
  normalize() {
    const d = APP.db; ALL_TABLES.forEach(t => { if (!Array.isArray(d[t])) d[t] = []; });
    d.meta = d.meta || { schemaVersion: 1 }; d.settings = d.settings || {};
    d.settings.jobNumber = d.settings.jobNumber || { prefix: 'JOB', pattern: '{PREFIX}-{TYPE}-{YYYY}-{SEQ}', padding: 4, nextSeq: 1, typeCodes: { Service: 'SRV', Supply: 'SUP', 'Supply/Services': 'SSV' } };
    d.roles.forEach(r => { if (r.permissions && !('quickAddMaster' in r.permissions)) r.permissions.quickAddMaster = !!r.permissions.jobCreate; });
    let migrated = false;
    if ((d.meta.schemaVersion || 1) < 2) { // v2: manpower lines = headcount × hours per person per day × days × rate (cost preserved)
      for (const t of ['plannedManpower', 'actualManpower']) for (const l of d[t]) {
        if (isNum(l.days)) continue; const days = autoDays(t === 'plannedManpower' ? l.startDate : l.dateFrom, t === 'plannedManpower' ? l.endDate : l.dateTo) || 1;
        l.hoursPerPerson = Math.round(num(l.hoursPerPerson) / days * 10000) / 10000; l.days = days;
      }
      d.meta.schemaVersion = 2; migrated = true;
    }
    return migrated;
  },
  persist() {
    APP.db.meta.savedAt = nowISO(); APP.rev++; APP.cache = {};
    try { localStorage.setItem(STORE_KEY, JSON.stringify(APP.db)); }
    catch (e) { throw new AppError('Could not save to browser storage (quota full?). Export your data, then reset.', 'storage'); }
  },
  loadFrom(obj, label) { APP.db = obj; Store.normalize(); Store.persist(); APP.source = label; APP.user = APP.db.users.find(u => u.id === APP.user?.id && u.active) || APP.db.users.find(u => u.active); },
  async resetToFile() { const r = await fetch('data.json', { cache: 'no-store' }); if (!r.ok) throw new Error('data.json not reachable'); Store.loadFrom(await r.json(), 'data.json'); },
};

/* ---------------- lookup & permissions ---------------- */
const T = t => APP.db[t];
const get = (t, id) => id ? APP.db[t].find(r => r.id === id) : null;
const live = t => APP.db[t].filter(r => !r.archived);
const nameOf = (t, id, f = 'name') => get(t, id)?.[f] || '';
function roleOf(u) { return u && APP.db.roles.find(r => r.id === u.roleId); }
function can(p) { const r = roleOf(APP.user); return !!(r && r.permissions && r.permissions[p]); }
function canType(type) { const r = roleOf(APP.user); return !!r && (!r.jobTypes || !r.jobTypes.length || r.jobTypes.includes(type)); }
function need(p, msg) { if (!APP.user || !APP.user.active) deny('No active user session.'); if (!can(p)) deny(msg || `Permission required: ${PERMS.find(x => x[0] === p)?.[1] || p}`); }
function needJobAccess(job) { if (!job) invalid('Job not found.'); if (!canType(job.type)) deny(`Your role has no access to ${job.type} jobs.`); }
/* closed-job lock — enforced here for every job-linked write */
function needUnlocked(job, reason) {
  if (!job.locked) return;
  if (!can('editClosedJobs')) deny(`Job ${job.jobNo} is closed and locked. Only users with “Edit closed jobs” can change it.`);
  if (!reason || !String(reason).trim()) invalid('A reason is required to change a closed job.', { reason: 'Required for locked jobs' });
}

/* ---------------- indices + calculation engine ---------------- */
function idx() {
  if (APP.cache.idx) return APP.cache.idx;
  const I = { byJob: {}, payByMisc: {}, payByInv: {}, asgByEmp: {}, leaveByEmp: {} };
  const tabs = ['plannedManpower', 'actualManpower', 'plannedMaterials', 'actualMaterials', 'inventoryTransfers', 'plannedMisc', 'actualMisc', 'invoices', 'assignments', 'jobComments', 'jobAttachments', 'jobStatusHistory', 'poRevisions', 'closures'];
  for (const t of tabs) for (const r of APP.db[t]) { if (r.archived) continue; ((I.byJob[r.jobId] ||= {})[t] ||= []).push(r); }
  for (const p of APP.db.miscPayments) if (!p.archived) (I.payByMisc[p.miscId] ||= []).push(p);
  for (const p of APP.db.invoicePayments) if (!p.archived) (I.payByInv[p.invoiceId] ||= []).push(p);
  for (const a of APP.db.assignments) if (!a.archived) (I.asgByEmp[a.employeeId] ||= []).push(a);
  for (const l of APP.db.leaves) if (!l.archived) (I.leaveByEmp[l.employeeId] ||= []).push(l);
  return APP.cache.idx = I;
}
const L = (jobId, t) => (idx().byJob[jobId] || {})[t] || [];
const Calc = {
  days: l => isNum(l.days) && +l.days > 0 ? +l.days : 1,
  mp: l => r2(num(l.headcount) * num(l.hoursPerPerson) * Calc.days(l) * num(l.rate)),
  mpHours: l => num(l.headcount) * num(l.hoursPerPerson) * Calc.days(l),
  qty: l => r2(num(l.qty) * num(l.unitPrice)),
  tr: l => r2(num(l.qty) * num(l.unitCost)),
  miscPaid: m => r2(sum(idx().payByMisc[m.id] || [], p => r2(p.amount))),
  miscStatus(m) { const p = Calc.miscPaid(m), a = r2(m.amount); return p <= 0 ? 'Unpaid' : p + 0.005 >= a ? 'Paid' : 'Partially Paid'; },
  invPaid: i => r2(sum(idx().payByInv[i.id] || [], p => r2(p.amount))),
  invStatus(i) { const p = Calc.invPaid(i), a = r2(i.amount); return p <= 0 ? 'Unpaid' : p + 0.005 >= a ? 'Paid' : 'Partially Paid'; },
  jobInvoiceStatus(job) {
    const inv = L(job.id, 'invoices'); if (!inv.length) return 'Uninvoiced';
    const st = inv.map(i => i.status || Calc.invStatus(i));
    if (st.every(s => s === 'Paid')) return 'Paid';
    if (st.some(s => s !== 'Unpaid')) return 'Partially Paid';
    return 'Unpaid';
  },
  job(job) {
    const c = APP.cache.fin ||= {}; if (c[job.id]) return c[job.id];
    const id = job.id, S = APP.db.settings;
    const pmL = L(id, 'plannedManpower'), amL = L(id, 'actualManpower');
    const f = {
      plannedManpower: r2(sum(pmL, Calc.mp)), actualManpower: r2(sum(amL, Calc.mp)),
      plannedHeadcount: sum(pmL, l => num(l.headcount)), actualHeadcount: sum(amL, l => num(l.headcount)),
      plannedHours: sum(pmL, Calc.mpHours), actualHours: sum(amL, Calc.mpHours),
      plannedMaterial: r2(sum(L(id, 'plannedMaterials'), Calc.qty)),
      actualMaterialPurchased: r2(sum(L(id, 'actualMaterials'), Calc.qty)),
      actualMaterialTransfer: r2(sum(L(id, 'inventoryTransfers').filter(t => (t.status || 'Posted') === 'Posted'), Calc.tr)),
      plannedMisc: r2(sum(L(id, 'plannedMisc'), l => r2(l.amount))), actualMisc: r2(sum(L(id, 'actualMisc'), l => r2(l.amount))),
    };
    f.miscPaid = r2(sum(L(id, 'actualMisc'), Calc.miscPaid)); f.miscOutstanding = r2(f.actualMisc - f.miscPaid);
    f.actualMaterial = r2(f.actualMaterialPurchased + f.actualMaterialTransfer);
    f.plannedPO = r2(job.poValue);
    const inv = L(id, 'invoices');
    f.invoiced = r2(sum(inv, i => r2(i.amount))); f.paid = r2(sum(inv, Calc.invPaid)); f.outstanding = r2(f.invoiced - f.paid);
    f.actualPO = S.revenueRule === 'invoiced' ? f.invoiced : (isNum(job.actualPoValue) ? r2(job.actualPoValue) : f.plannedPO);
    f.plannedCost = r2(f.plannedManpower + f.plannedMaterial + f.plannedMisc);
    f.actualCost = r2(f.actualManpower + f.actualMaterial + f.actualMisc);
    f.plannedGP = r2(f.plannedPO - f.plannedCost); f.actualGP = r2(f.actualPO - f.actualCost);
    f.plannedGPPct = f.plannedPO > 0 ? f.plannedGP / f.plannedPO * 100 : null;
    f.actualGPPct = f.actualPO > 0 ? f.actualGP / f.actualPO * 100 : null;
    f.costVariance = r2(f.actualCost - f.plannedCost); f.gpVariance = r2(f.actualGP - f.plannedGP);
    f.hasActuals = f.actualCost > 0;

    return c[job.id] = f;
  },
};

/* ---------------- audit + transactions ---------------- */
const SKIP_DIFF = new Set(['updatedAt', 'version', 'createdAt', 'createdBy', 'updatedBy']);
function diff(before, after) {
  if (!before || !after) return { before, after };
  const b = {}, a = {};
  for (const k of new Set([...Object.keys(before), ...Object.keys(after)])) {
    if (SKIP_DIFF.has(k)) continue;
    if (JSON.stringify(before[k]) !== JSON.stringify(after[k])) { b[k] = before[k]; a[k] = after[k]; }
  }
  return { before: b, after: a };
}
function audit(action, entity, recordId, before, after, reason, jobId) {
  const d = (action === 'update') ? diff(before, after) : { before, after };
  APP.db.auditLog.push({ id: uid('aud'), at: nowISO(), userId: APP.user?.id, action, entity, recordId, jobId: jobId || null, before: d.before ?? null, after: d.after ?? null, reason: reason || null });
}
let TXD = 0; // re-entrant: only the outermost call commits or rolls back
function tx(fn) {
  if (TXD > 0) { TXD++; try { return fn(); } finally { TXD--; } }
  const snap = JSON.stringify(APP.db); TXD = 1;
  try { const out = fn(); Store.persist(); return out; }
  catch (e) { APP.db = JSON.parse(snap); APP.cache = {}; throw e; }
  finally { TXD = 0; }
}
function stampNew(r) { const t = nowISO(); return Object.assign(r, { createdAt: t, createdBy: APP.user.id, updatedAt: t, updatedBy: APP.user.id, version: 1, archived: false }); }
function stampUpd(r) { r.updatedAt = nowISO(); r.updatedBy = APP.user.id; r.version = (r.version || 1) + 1; return r; }
function checkVersion(rec, v) {
  if (v != null && rec.version != null && +v !== +rec.version) {
    const u = nameOf('users', rec.updatedBy) || 'another user';
    throw new AppError(`This record was changed by ${u} at ${fmtDT(rec.updatedAt)} after you opened it. Your changes were not saved — reload and re-apply them.`, 'conflict');
  }
}
// double-submit guard: a token is checked before work and only consumed after a successful commit
function once(token) { if (token && APP.tokens.has(token)) throw new AppError('This form was already submitted.', 'duplicate'); }
function used(token, out) { if (token) APP.tokens.add(token); return out; }

/* ---------------- validation helpers ---------------- */
function vNum(o, k, label, { min = 0, max = null, req = false, int = false } = {}, errs) {
  const v = o[k];
  if (v === '' || v == null) { if (req) errs[k] = `${label} is required`; else o[k] = null; return; }
  if (isNaN(+v)) { errs[k] = `${label} must be a number`; return; }
  o[k] = +v;
  if (min != null && o[k] < min) errs[k] = `${label} must be ≥ ${min}`;
  if (max != null && o[k] > max) errs[k] = `${label} must be ≤ ${max}`;
  if (int && !Number.isInteger(o[k])) errs[k] = `${label} must be a whole number`;

function vDate(o, k, label, req, errs) { if (!o[k]) { o[k] = null; if (req) errs[k] = `${label} is required`; return; } if (!validDate(o[k])) errs[k] = `${label} is not a valid date`; }

/* ---------------- job numbering ---------------- */
function formatJobNo(type, dateISO, seq, cfg) {
  cfg = cfg || APP.db.settings.jobNumber; const y = (dateISO || todayISO()).slice(0, 4);
  return cfg.pattern.replace('{PREFIX}', cfg.prefix).replace('{TYPE}', cfg.typeCodes[type] || type.slice(0, 3).toUpperCase())
    .replace('{YYYY}', y).replace('{YY}', y.slice(2)).replace('{SEQ}', String(seq).padStart(cfg.padding || 4, '0'));
}
function nextJobNo(type, dateISO) {

  let seq = Math.max(1, cfg.nextSeq | 0), no = formatJobNo(type, dateISO, seq);
  while (used.has(no)) { seq++; no = formatJobNo(type, dateISO, seq); }

/* ---------------- roster load engine ---------------- */
const isWorkDay = iso => (APP.db.settings.workingDays || [1, 2, 3, 4, 5]).includes(dow(iso));
/** default day count for a date range: working days per the Settings calendar; a range with no working days counts calendar days */

  if (!from) return null; to = to && to >= from ? to : from; let wd = 0, cd = 0;
  for (let d = from; d <= to && cd < 1000; d = addDays(d, 1)) { cd++; if (isWorkDay(d)) wd++; }
  return wd || cd;
}

function onLeave(empId, iso) { return (idx().leaveByEmp[empId] || []).find(l => l.fromDate <= iso && l.toDate >= iso); }
function loadOn(empId, iso, excludeId) {
  return (idx().asgByEmp[empId] || []).filter(a => a.id !== excludeId && ['Planned', 'Assigned'].includes(a.status) && a.startDate <= iso && a.endDate >= iso);
}
function dayState(emp, iso) {
  const lv = onLeave(emp.id, iso); const asg = loadOn(emp.id, iso); const done = (idx().asgByEmp[emp.id] || []).filter(a => a.status === 'Completed' && a.startDate <= iso && a.endDate >= iso);
  const alloc = sum(asg, a => num(a.allocationPct)); const cap = capacityOf(emp);
  let state = 'Available';
  if (lv) state = 'On Leave'; else if (alloc > cap) state = 'Overbooked'; else if (alloc >= cap && alloc > 0) state = 'Fully Booked';
  else if (alloc > 0) state = asg.every(a => a.status === 'Planned') ? 'Assignment Pending' : 'Partially Available';
  else if (done.length) state = 'Completed Assignment';
  return { state, alloc, cap, asg, lv, done };
}
function conflictsFor(rec) {
  const emp = get('employees', rec.employeeId); const out = [];
  if (!emp) return [{ type: 'missing', msg: 'Employee not found' }];
  if (emp.status !== 'Active') out.push({ type: 'inactive', msg: `${emp.name} is inactive` });
  if (emp.type === 'outsourced' && emp.contractEnd && rec.endDate > emp.contractEnd) out.push({ type: 'contract', msg: `Contract ends ${fmtDate(emp.contractEnd)}` });
  let worst = 0, worstDay = null, leaveDays = [], jobs = new Set();
  for (let d = rec.startDate; d <= rec.endDate; d = addDays(d, 1)) {
    if (!isWorkDay(d)) continue;

    if (tot > capacityOf(emp) && tot > worst) { worst = tot; worstDay = d; other.forEach(a => jobs.add(get('jobs', a.jobId)?.jobNo)); }

  if (leaveDays.length) out.push({ type: 'leave', msg: `On leave ${leaveDays.length} working day(s) from ${fmtDate(leaveDays[0])}` });
  if (worstDay) out.push({ type: 'overbook', msg: `Overbooked to ${worst}% of ${capacityOf(emp)}% capacity on ${fmtDate(worstDay)} (also on ${[...jobs].join(', ')})` });
  return out;
}

const ic = (n, cls = '') => `<svg class="ico ${cls}" aria-hidden="true"><use href="#wow-${n}"/></svg>`;
const ACT = {};          // delegated click actions: data-act="name"

/* ---------------- routing ---------------- */
function parseRoute() {
  const h = location.hash.replace(/^#\/?/, '') || 'overview';
  const [p, q] = h.split('?'); const parts = p.split('/').filter(Boolean).map(decodeURIComponent);
  const params = Object.fromEntries(new URLSearchParams(q || ''));
  return { parts, params, view: parts[0] || 'overview' };
}
const go = (hash) => { if (location.hash === hash) render(); else location.hash = hash; };
const qs = o => { const p = new URLSearchParams(); Object.entries(o).forEach(([k, v]) => { if (v != null && v !== '') p.set(k, v); }); const s = p.toString(); return s ? '?' + s : ''; };

function setCrumbs(list) {
  CRUMBS = list; const el = $('#crumbs'); if (!el) return;
  el.innerHTML = list.map((c, i) => i === list.length - 1 ? `<b aria-current="page">${esc(c[0])}</b>` : `<a href="${c[1]}">${esc(c[0])}</a><span aria-hidden="true">/</span>`).join('');
  document.title = list.map(c => c[0]).reverse().join(' · ') + ' — JobOps';
}

function render(keepScroll) {
  const r = parseRoute(); const root = $('#app');
  root.innerHTML = shell();
  const nav = NAV.find(n => n[0] === (r.view === 'job' ? 'jobs' : r.view));
  const view = $('#view');
  if (!VIEWS[r.view]) { location.hash = '#/overview'; return; }
  if (nav && !can(nav[3])) {
    const first = NAV.find(n => can(n[3]));
    setCrumbs([[nav[1], '#']]);
    view.innerHTML = `<div class="card empty">${ic('lock')}<b>No access to ${esc(nav[1])}</b>Your role (${esc(roleOf(APP.user)?.name)}) does not include this tab.${first ? ` <a href="#/${first[0]}">Go to ${first[1]}</a>` : ''}</div>`;
    return;
  }
  try { VIEWS[r.view](view, r); }
  catch (e) { console.error(e); view.innerHTML = `<div class="card empty">${ic('error')}<b>Something went wrong rendering this page</b>${esc(e.message)}<br><br><button class="btn" data-act="reload">Reload</button></div>`; }
  if (!keepScroll) window.scrollTo(0, 0);
}
function rerender() {
  const a = document.activeElement; const fk = a && a.dataset && a.dataset.focusKey; const pos = fk && a.selectionStart;
  const y = window.scrollY; render(true); window.scrollTo(0, y);
  if (fk) { const n = document.querySelector(`[data-focus-key="${fk}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } } }
}

/* ---------------- toasts / errors ---------------- */
function toast(msg, kind = '') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.innerHTML = (kind === 'err' ? ic('error') : ic('success')) + `<span>${esc(msg)}</span>`;
  $('#toasts')?.appendChild(t); setTimeout(() => t.remove(), kind === 'err' ? 6500 : 3200);
}

  if (root) {

   Overview dashboard
   ===================================================================== */
function scopedJobs(f = {}) {
  return APP.db.jobs.filter(j => !j.archived && canType(j.type)
    && (!f.type || j.type === f.type) && (!f.cust || j.customerId === f.cust) && (!f.status || j.status === f.status)
    && (!f.from || j.openingDate >= f.from) && (!f.to || j.openingDate <= f.to));
}
function monthsRange(from, to) {
  const t = todayISO(); let a = (from || (t.slice(0, 4) + '-01-01')).slice(0, 7), b = (to || t).slice(0, 7); const out = [];
  if (a > b) [a, b] = [b, a];
  let [y, m] = a.split('-').map(Number); while (`${y}-${String(m).padStart(2, '0')}` <= b && out.length < 36) { out.push(`${y}-${String(m).padStart(2, '0')}`); m++; if (m > 12) { m = 1; y++; } }
  return out;
}
function rosterToday() {
  const t = todayISO(); const emps = APP.db.employees.filter(e => !e.archived && e.status === 'Active');
  let cap = 0, booked = 0, assigned = 0, available = 0, leave = 0;
  for (const e of emps) {
    const s = dayState(e, t); if (s.lv) { leave++; continue; }
    cap += s.cap; booked += Math.min(s.alloc, s.cap);
    if (s.asg.length) assigned++; if (s.alloc < s.cap) available++;
  }
  return { total: emps.length, cap, booked, util: cap ? booked / cap * 100 : null, assigned, available, leave };
}

/* ---------------- period filter: year / quarter / month (fiscal-year aware) ---------------- */
const fyStart = () => +(APP.db.settings.fiscalYearStartMonth || 1);
const fyOf = iso => { const y = +iso.slice(0, 4), m = +iso.slice(5, 7); return m >= fyStart() ? y : y - 1; };
const fyLabel = y => fyStart() === 1 ? String(y) : `FY ${y}/${String((y + 1) % 100).padStart(2, '0')}`;
const absToKey = a => `${Math.floor(a / 12)}-${String(a % 12 + 1).padStart(2, '0')}`;
const lastDay = key => { const [y, m] = key.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10); };
function periodMonths(f) { // absolute month indices covered by year (+quarter)
  if (!f.year) return [];
  const s0 = (+f.year) * 12 + fyStart() - 1; const a = f.q ? s0 + (f.q - 1) * 3 : s0; const n = f.q ? 3 : 12;
  return Array.from({ length: n }, (_, i) => a + i);
}
function periodRange(f) {
  if (!f.year) return { from: '', to: '', label: 'All periods' };
  if (f.m) return { from: f.m + '-01', to: lastDay(f.m), label: monthLabel(f.m) };
  const M = periodMonths(f); const a = absToKey(M[0]), b = absToKey(M[M.length - 1]);
  return { from: a + '-01', to: lastDay(b), label: (f.q ? `Q${f.q} ` : '') + fyLabel(+f.year) };
}
function quarterLabel(q) { const a = (fyStart() - 1 + (q - 1) * 3) % 12; return `Q${q} (${MON[a]}–${MON[(a + 2) % 12]})`; }
/* ---------------- billing pipeline: unbilled PO value expected in the next 3 months ---------------- */
function billMonths() { const t = todayISO(); const a = (+t.slice(0, 4)) * 12 + (+t.slice(5, 7)) - 1; return [a, a + 1, a + 2].map(absToKey); }
/** bucket for a job's unbilled value: 'ready' (completed/closed, not fully billed), 'YYYY-MM' (planned finish in next 3 months), 'late' (planned finish already passed), or null */
function billBucket(j) {
  if (j.archived || j.status === 'Cancelled') return null;
  const x = Calc.job(j); if (x.actualPO - x.invoiced <= 0.005) return null;
  if (['Completed', 'Closed'].includes(j.status)) return 'ready';
  if (!j.pfDate) return null;
  const M = billMonths(); const k = monthKey(j.pfDate);
  if (k < M[0]) return 'late'; return M.includes(k) ? k : null;
}
function billingPipeline(f) {
  const out = { ready: 0, late: 0, months: Object.fromEntries(billMonths().map(m => [m, 0])), jobs: 0, total: 0 };
  for (const j of APP.db.jobs) {
    if (!canType(j.type) || (f.type && j.type !== f.type) || (f.cust && j.customerId !== f.cust)) continue;
    const b = billBucket(j); if (!b) continue; const x = Calc.job(j); const v = r2(x.actualPO - x.invoiced);
    if (b === 'ready') out.ready = r2(out.ready + v); else if (b === 'late') out.late = r2(out.late + v); else out.months[b] = r2(out.months[b] + v);
    out.jobs++; out.total = r2(out.total + v);
  }
  return out;
}

      ${isNew ? `<a class="btn" href="#/jobs/${TYPE_SLUG[type]}">Cancel</a>` : ''}<button class="btn primary" type="submit" id="jobSave">${ic('save', 'sm')}${isNew ? 'Create job' : 'Save changes'}</button></div>` : `<p class="small muted">${ic('lock', 'sm')} Read-only — ${job.locked ? 'this job is closed and locked.' : 'your role cannot edit jobs.'}</p>`}
  </form>`;
  root.innerHTML = isNew ? html : html;
  const form = $('#jobForm', root); if (!editable) return;
  const token = uid('tok');
  if (isNew) form.addEventListener('change', e => { if (e.target.name === 'type' || e.target.name === 'openingDate') { const v = readForm(form, all); $('[name=jobNo]', form).value = nextJobNo(v.type, v.openingDate || todayISO()).no + ' (preview)'; } });
  form.addEventListener('submit', async e => {
    e.preventDefault(); const btn = $('#jobSave'); if (btn.disabled) return; btn.disabled = true;
    try {
      const v = readForm(form, all); delete v.jobNo;
      if (isNew) {
        const j = API.createJob(v, token); toast(`Job ${j.jobNo} created`); location.hash = `#/job/${j.id}/manpower`; return;
      }
      const patch = {}; for (const k of Object.keys(v)) if (k !== 'reason' && k !== 'type' && String(v[k] ?? '') !== String(job[k] ?? '')) patch[k] = v[k];
      if (!Object.keys(patch).length) { toast('No changes to save'); return; }
      if (patch.status === 'Completed' && S.suggest100OnCompleted && num(v.completionPct) < 100) {
        const c = await confirmBox({ title: 'Set completion to 100%?', message: `Status is changing to <b>Completed</b> but completion is ${num(v.completionPct)}%. Update completion to 100%? Choose Cancel to keep ${num(v.completionPct)}%.`, confirm: 'Set to 100%' });
        if (c.ok) patch.completionPct = 100;
      }
      API.updateJob(job.id, patch, job.version, v.reason); toast('Job saved'); rerender();
    } catch (err) { showErr(err, form); } finally { btn.disabled = false; }
  });
}

function integrityCheck() {
  const out = []; const D = APP.db; const has = (t, id) => !id || D[t].some(r => r.id === id);
  const nos = {}; D.jobs.forEach(j => { if (nos[j.jobNo]) out.push(`Duplicate job number ${j.jobNo}`); nos[j.jobNo] = 1; if (!has('customers', j.customerId)) out.push(`${j.jobNo}: missing company`); if (j.status === 'Closed' && !j.locked) out.push(`${j.jobNo}: closed but not locked`); });
  ['plannedManpower', 'actualManpower', 'plannedMaterials', 'actualMaterials', 'inventoryTransfers', 'plannedMisc', 'actualMisc', 'invoices', 'assignments'].forEach(t => D[t].forEach(r => { if (!has('jobs', r.jobId)) out.push(`${t} ${r.id}: job missing`); }));
  const refs = {}; D.inventoryTransfers.filter(t => t.status === 'Posted').forEach(t => { if (refs[t.ref]) out.push(`Transfer ${t.ref} posted twice`); refs[t.ref] = 1; });
  D.invoices.filter(i => !i.archived).forEach(i => { if (i.status !== Calc.invStatus(i)) out.push(`Invoice ${i.invoiceNo}: status ${i.status} ≠ payments (${Calc.invStatus(i)})`); });
  D.plannedManpower.filter(l => l.assignmentId && !l.archived).forEach(l => { const a = get('assignments', l.assignmentId); if (!a || a.status === 'Cancelled') out.push(`Planned manpower ${l.id}: linked assignment missing/cancelled`); });
  return out;
}

  $('#bootFile').onchange = ev => { const f = ev.target.files[0]; const rd = new FileReader(); rd.onload = () => { try { APP.db = JSON.parse(rd.result); APP.source = f.name; Store.normalize(); Store.persist(); APP.user = APP.db.users.find(u => u.active && roleOf(u)?.permissions.manageUsers) || APP.db.users.find(u => u.active); render(); } catch (err) { alertBox(err.message); } }; rd.readAsText(f); };
}
const alertBox = m => { const p = $('.boot .card'); p && p.insertAdjacentHTML('beforeend', `<div class="alert err" style="margin-top:12px">${esc(m)}</div>`); };
(async function main() {
  bindGlobal();
  try { await Store.boot(); render(); }
  catch (e) { console.warn(e); bootError(e); }
})();

</script>
</body>
</html>
